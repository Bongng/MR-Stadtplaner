<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AR/VR Stadtplaner</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hit-test, local-floor;" ar-hit-test="target: #stadt;" renderer="colorManagement: true;">

    <a-assets></a-assets>

    <a-light id="grundlicht" type="ambient" intensity="0.65"></a-light>
    <a-light id="sonnenlicht" type="directional" position="3 5 2" intensity="0.85"></a-light>

    <a-sky id="himmel" color="skyblue" hide-on-enter-ar></a-sky>
    <a-plane id="boden" position="0 0 0" rotation="-90 0 0" width="25" height="25" color="mediumseagreen" hide-on-enter-ar></a-plane>

    <a-entity id="stadt" position="0 0 -2"></a-entity>

    <a-entity id="menue" position="-0.85 1.35 -1.25" rotation="0 25 0"></a-entity>

    <a-entity id="spieler">
      <a-camera position="0 1.6 0">
        <a-cursor raycaster="objects: .klickbar"></a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: .klickbar"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .klickbar"></a-entity>
    </a-entity>

  </a-scene>

  <script>
  </script>

</body>
</html>
